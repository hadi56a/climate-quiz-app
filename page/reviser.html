<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Réviser – Quiz Climat</title>
  <meta name="description" content="Toutes les questions du quiz climat avec leurs réponses et explications.">
  <meta name="author" content="Hadi Assi">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g'%3E%3Cstop offset='0' stop-color='%2308519c'/%3E%3Cstop offset='1' stop-color='%23a50f15'/%3E%3C/linearGradient%3E%3C/defs%3E%3Ccircle cx='16' cy='16' r='15' fill='url(%23g)'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="../css/style.css">
  <script src="../js/common.js" defer></script>
  <script src="../js/reviser.js" defer></script>
</head>
<body>
  <div class="stripes" aria-hidden="true"></div>
  <header class="site-header">
    <div class="wrap header-inner">
      <a class="brand" href="../index.html"><span class="brand-mark" aria-hidden="true"></span>Quiz Climat</a>
      <nav class="nav" aria-label="Navigation principale">
        <a href="../index.html">Jouer</a>
        <a href="reviser.html" aria-current="page">Réviser</a>
        <a href="statistiques.html">Statistiques</a>
        <span id="user-zone"></span>
      </nav>
    </div>
  </header>

  <main>

    <section class="page-head">
      <div class="wrap">
        <h1>Réviser</h1>
        <p class="lead">Retrouvez les 30 questions, filtrez par thème et lisez l’explication de chaque réponse.</p>
      </div>
    </section>
    <section class="section" style="padding-top: 0;">
      <div class="wrap">
        <div class="toolbar">
          <div class="field">
            <label for="recherche">Rechercher</label>
            <input type="search" id="recherche" placeholder="Par exemple : océans, CO₂, énergie…">
          </div>
          <div class="field">
            <label for="theme">Thème</label>
            <select id="theme">
              <option value="tout">Tous les thèmes</option>
              <option value="climat">Climat</option>
              <option value="energie">Énergie</option>
              <option value="gaz">Gaz à effet de serre</option>
            </select>
          </div>
          <div class="field">
            <label for="tri">Trier par</label>
            <select id="tri">
              <option value="numero">Numéro</option>
              <option value="theme">Thème</option>
              <option value="niveau">Niveau</option>
            </select>
          </div>
        </div>
        <p class="muted" id="compteur" aria-live="polite"></p>
        <ul class="q-list" id="liste"></ul>
        <nav class="pager" id="pager" aria-label="Pages"></nav>
      </div>
    </section>

  </main>

  <footer class="site-footer">
    <div class="wrap">Quiz Climat, projet web réalisé par Hadi Assi en 2024. Questions chargées depuis un fichier XML, sans framework.</div>
  </footer>
</body>
</html>
